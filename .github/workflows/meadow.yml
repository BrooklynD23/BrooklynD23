name: Refresh scene + featured

# GitHub delays scheduled runs on quiet repos by hours, so the schedule is only a backstop.
# Each run stays alive ~5.5 h, refreshing every 15 min, then dispatches the next run itself
# (workflow_dispatch via GITHUB_TOKEN is allowed). The concurrency group keeps at most one
# chain alive: a queued run waits, and a newer queued run replaces an older one.

on:
  schedule:
    - cron: "23 */3 * * *" # backstop: restarts the chain if it ever breaks
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline tests
        run: node --test scripts/
      - name: Refresh every 15 minutes for ~5.5 hours
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 22); do
            git pull -q --rebase origin main || { echo "pull failed, retry next tick"; sleep 900; continue; }
            out=$(mktemp)
            # Builds and validates in memory; on any error writes nothing, so the last good header stays.
            GITHUB_OUTPUT="$out" node scripts/generate.mjs || echo "scene: generator failed, header unchanged"
            PHASE=$(sed -n 's/^phase=//p' "$out" | tail -1)
            # On API failure prints a warning and leaves README.md untouched.
            node scripts/featured.mjs || echo "featured: failed, README unchanged"
            scene=0; feat=0
            git diff --quiet -- assets/header.svg || scene=1
            git diff --quiet -- README.md || feat=1
            if [ "$scene$feat" != "00" ]; then
              if [ "$scene$feat" = "11" ]; then msg="chore: refresh scene ($PHASE) + featured"
              elif [ "$scene" = "1" ]; then msg="chore: refresh scene ($PHASE)"
              else msg="chore: refresh featured"; fi
              git add assets/header.svg README.md
              git commit -q -m "$msg"
              git push -q || echo "push failed, retry next tick"
            fi
            # `[ ... ] && sleep` would end the script with exit 1 on the last pass and fail the run
            if [ "$i" -lt 22 ]; then sleep 900; fi
          done
      - name: Start the next run
        # Only after a healthy run: a failing test must not spin a fast restart loop (the cron backstop retries).
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run meadow.yml -R "$GITHUB_REPOSITORY" --ref main
